<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background:
                linear-gradient(rgba(5, 25, 55, 0.75), rgba(5, 25, 55, 0.75)),
                url("https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=1600&q=80");

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 15px;
        }

        /* MAIN FORM */

        .registration-container {
            width: 100%;
            max-width: 850px;

            background: rgba(255, 255, 255, 0.97);

            border-radius: 20px;

            padding: 40px;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        /* HEADER */

        .form-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .form-header h1 {
            color: #092d59;
            font-size: 34px;
            margin-bottom: 8px;
        }

        .form-header h1 span {
            color: #08aeda;
        }

        .form-header p {
            color: #68778c;
            font-size: 14px;
        }

        /* SECTION TITLE */

        .section-title {
            color: #092d59;
            font-size: 20px;

            margin-top: 25px;
            margin-bottom: 20px;

            padding-bottom: 8px;

            border-bottom: 2px solid #dcecf5;
        }

        /* FORM GRID */

        .form-row {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;

            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        /* LABEL */

        label {
            font-size: 14px;

            font-weight: 600;

            color: #26384d;

            margin-bottom: 7px;
        }

        .required {
            color: red;
        }

        /* INPUT */

        input,
        select,
        textarea {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #ccd9e6;

            border-radius: 9px;

            font-size: 14px;

            outline: none;

            transition: 0.3s;

            background: white;
        }

        input:focus,
        select:focus,
        textarea:focus {

            border-color: #0bb8e5;

            box-shadow:
                0 0 0 3px rgba(11, 184, 229, 0.12);
        }

        textarea {

            min-height: 100px;

            resize: vertical;
        }

        

        .gender-options {

            display: flex;

            gap: 25px;

            padding-top: 10px;
        }

        .gender-options label {

            display: flex;

            flex-direction: row;

            align-items: center;

            gap: 7px;

            font-weight: 400;

            cursor: pointer;
        }

        .gender-options input {

            width: auto;

            accent-color: #08aeda;
        }

        /* HOBBIES */

        .hobby-options {

            display: flex;

            flex-wrap: wrap;

            gap: 18px;

            padding-top: 8px;
        }

        .hobby-options label {

            display: flex;

            flex-direction: row;

            align-items: center;

            gap: 7px;

            font-weight: 400;

            cursor: pointer;
        }

        .hobby-options input {

            width: auto;

            accent-color: #08aeda;
        }

        /* FILE */

        input[type="file"] {

            padding: 10px;

            background: #f8fbfd;

        }

        /* PASSWORD */

        .password-box {

            position: relative;
        }

        .password-box input {

            padding-right: 70px;
        }

        .show-password {

            position: absolute;

            right: 12px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: none;

            color: #078aaa;

            font-size: 12px;

            font-weight: bold;

            cursor: pointer;
        }

        /* TERMS */

        .terms {

            display: flex;

            align-items: flex-start;

            gap: 10px;

            margin: 25px 0;

            color: #536274;

            font-size: 13px;

            line-height: 1.5;
        }

        .terms input {

            width: auto;

            margin-top: 3px;

            accent-color: #08aeda;

        }

        .terms a {

            color: #078aaa;

            text-decoration: none;

            font-weight: bold;
        }

        /* BUTTONS */

        .buttons {

            display: flex;

            gap: 15px;

            margin-top: 25px;
        }

        button {

            flex: 1;

            padding: 14px;

            border: none;

            border-radius: 9px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .register-btn {

            background: #08aeda;

            color: white;
        }

        .register-btn:hover {

            background: #078eaf;

            transform: translateY(-2px);
        }

        .reset-btn {

            background: #e9eef3;

            color: #34495e;
        }

        .reset-btn:hover {

            background: #d8e0e7;
        }

        /* FOOTER */

        .login-text {

            text-align: center;

            margin-top: 25px;

            color: #64748b;

            font-size: 14px;
        }

        .login-text a {

            color: #078aaa;

            font-weight: bold;

            text-decoration: none;
        }

        /* RESPONSIVE */

        @media (max-width: 650px) {

            .registration-container {

                padding: 25px 20px;
            }

            .form-row {

                grid-template-columns: 1fr;
            }

            .form-group.full {

                grid-column: auto;
            }

            .form-header h1 {

                font-size: 28px;
            }

            .buttons {

                flex-direction: column;
            }

        }

    </style>

</head>


<body>


    <div class="registration-container">


        <!-- HEADER -->

        <div class="form-header">

            <h1>
                Student <span>Registration</span>
            </h1>

            <p>
                Create your account by filling in the details below
            </p>

        </div>


        <form onsubmit="return validateForm()">


            <!-- PERSONAL INFORMATION -->

            <h2 class="section-title">
                Personal Information
            </h2>


            <div class="form-row">

                <div class="form-group">

                    <label>
                        First Name <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="firstName"
                        placeholder="Enter first name"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Last Name <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="lastName"
                        placeholder="Enter last name"
                        required>

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>
                        Date of Birth <span class="required">*</span>
                    </label>

                    <input
                        type="date"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Gender <span class="required">*</span>
                    </label>

                    <div class="gender-options">

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="Male"
                                required>

                            Male
                        </label>


                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="Female">

                            Female
                        </label>


                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="Other">

                            Other
                        </label>

                    </div>

                </div>

            </div>


            <!-- CONTACT INFORMATION -->

            <h2 class="section-title">
                Contact Information
            </h2>


            <div class="form-row">

                <div class="form-group">

                    <label>
                        Email Address <span class="required">*</span>
                    </label>

                    <input
                        type="email"
                        placeholder="example@gmail.com"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Mobile Number <span class="required">*</span>
                    </label>

                    <input
                        type="tel"
                        placeholder="10 digit mobile number"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        required>

                </div>

            </div>


            <div class="form-row">

                <div class="form-group full">

                    <label>
                        Address <span class="required">*</span>
                    </label>

                    <textarea
                        placeholder="Enter your complete address"
                        required></textarea>

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>
                        City <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        placeholder="Enter city"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        State <span class="required">*</span>
                    </label>

                    <select required>

                        <option value="">
                            Select State
                        </option>

                        <option>Karnataka</option>
                        <option>Goa</option>
                        <option>Maharashtra</option>
                        <option>Kerala</option>
                        <option>Tamil Nadu</option>
                        <option>Andhra Pradesh</option>
                        <option>Telangana</option>
                        <option>Delhi</option>
                        <option>Gujarat</option>
                        <option>Rajasthan</option>
                        <option>Other</option>

                    </select>

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>
                        Pincode <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        placeholder="6 digit pincode"
                        pattern="[0-9]{6}"
                        maxlength="6"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Country
                    </label>

                    <input
                        type="text"
                        value="India"
                        readonly>

                </div>

            </div>


            <!-- EDUCATIONAL INFORMATION -->

            <h2 class="section-title">
                Educational Information
            </h2>


            <div class="form-row">

                <div class="form-group">

                    <label>
                        Highest Qualification
                        <span class="required">*</span>
                    </label>

                    <select required>

                        <option value="">
                            Select Qualification
                        </option>

                        <option>10th</option>
                        <option>12th</option>
                        <option>Diploma</option>
                        <option>Degree</option>
                        <option>Post Graduation</option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Course
                        <span class="required">*</span>
                    </label>

                    <select required>

                        <option value="">
                            Select Course
                        </option>

                        <option>BCA</option>
                        <option>BBA</option>
                        <option>BCOM</option>
                        <option>B.Sc</option>
                        <option>BA</option>
                        <option>B.Tech</option>
                        <option>MCA</option>
                        <option>MBA</option>

                    </select>

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>
                        College / Institution
                    </label>

                    <input
                        type="text"
                        placeholder="Enter college name">

                </div>


                <div class="form-group">

                    <label>
                        Passing Year
                    </label>

                    <select>

                        <option value="">
                            Select Year
                        </option>

                        <option>2026</option>
                        <option>2025</option>
                        <option>2024</option>
                        <option>2023</option>
                        <option>2022</option>
                        <option>2021</option>

                    </select>

                </div>

            </div>


            <!-- HOBBIES -->

            <h2 class="section-title">
                Hobbies & Interests
            </h2>


            <div class="hobby-options">

                <label>
                    <input type="checkbox">
                    Reading
                </label>

                <label>
                    <input type="checkbox">
                    Dancing
                </label>

                <label>
                    <input type="checkbox">
                    Sports
                </label>

                <label>
                    <input type="checkbox">
                    Music
                </label>

                <label>
                    <input type="checkbox">
                    Photography
                </label>

                <label>
                    <input type="checkbox">
                    Travelling
                </label>

                <label>
                    <input type="checkbox">
                    Video Editing
                </label>

            </div>


            <!-- PROFILE -->

            <h2 class="section-title">
                Profile Information
            </h2>


            <div class="form-row">

                <div class="form-group">

                    <label>
                        Profile Photo
                    </label>

                    <input
                        type="file"
                        accept="image/*">

                </div>


                <div class="form-group">

                    <label>
                        ID / Student Number
                    </label>

                    <input
                        type="text"
                        placeholder="Enter ID number">

                </div>

            </div>


            <!-- ACCOUNT -->

            <h2 class="section-title">
                Account Information
            </h2>


            <div class="form-row">

                <div class="form-group">

                    <label>
                        Username <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        placeholder="Create username"
                        minlength="4"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Password <span class="required">*</span>
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Create password"
                            minlength="8"
                            required>

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('password', this)">

                            SHOW

                        </button>

                    </div>

                </div>

            </div>


            <div class="form-row">

                <div class="form-group full">

                    <label>
                        Confirm Password
                        <span class="required">*</span>
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm password"
                            minlength="8"
                            required>

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('confirmPassword', this)">

                            SHOW

                        </button>

                    </div>

                </div>

            </div>


            <!-- TERMS -->

            <div class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    required>

                <label for="terms">

                    I agree to the
                    <a href="#">
                        Terms & Conditions
                    </a>
                    and
                    <a href="#">
                        Privacy Policy
                    </a>.

                </label>

            </div>


            <!-- BUTTONS -->

            <div class="buttons">

                <button
                    type="submit"
                    class="register-btn">

                    Create Account

                </button>


                <button
                    type="reset"
                    class="reset-btn">

                    Reset Form

                </button>

            </div>


        </form>


        <!-- LOGIN -->

        <div class="login-text">

            Already have an account?

            <a href="#">
                Login Here
            </a>

        </div>


    </div>



    <script>

        /* SHOW / HIDE PASSWORD */

        function togglePassword(id, button) {

            const password =
                document.getElementById(id);

            if (password.type === "password") {

                password.type = "text";

                button.innerText = "HIDE";

            } else {

                password.type = "password";

                button.innerText = "SHOW";
            }
        }


        /* FORM VALIDATION */

        function validateForm() {

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;


            if (password !== confirmPassword) {

                alert("Password and Confirm Password do not match!");

                return false;
            }


            alert(
                "Registration successful!"
            );

            return true;
        }

    </script>


</body>

</html>
